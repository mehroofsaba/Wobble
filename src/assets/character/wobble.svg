      <stop offset="100%" stop-color="#FFB4C6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#D8C8F0"/>
      <stop offset="100%" stop-color="#9F86C8"/>
    </linearGradient>
  </defs>
  <ellipse id="shadow" cx="100" cy="182" rx="52" ry="7" fill="#A08FB8" opacity="0.22"/>
  <g id="body">
    <ellipse id="ear-left"  cx="52"  cy="55" rx="18" ry="18" fill="url(#earGrad)"/>
    <ellipse id="ear-right" cx="148" cy="55" rx="18" ry="18" fill="url(#earGrad)"/>
    <ellipse cx="52"  cy="55" rx="7" ry="7" fill="#E7D4FF" opacity="0.7"/>
    <ellipse cx="148" cy="55" rx="7" ry="7" fill="#E7D4FF" opacity="0.7"/>
    <ellipse id="torso" cx="100" cy="115" rx="72" ry="68" fill="url(#bodyGrad)"/>
    <ellipse cx="100" cy="115" rx="72" ry="68" fill="none" stroke="#B49FD6" stroke-width="1" opacity="0.35"/>
    <ellipse cx="82" cy="90" rx="22" ry="16" fill="#FFFFFF" opacity="0.35"/>
  </g>
  <g id="cheeks">
