<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#FFF4FA"/>
      <stop offset="55%" stop-color="#E2D2F6"/>
      <stop offset="100%" stop-color="#CBB6E8"/>
    </radialGradient>
    <radialGradient id="earGrad" cx="40%" cy="35%" r="70%">
